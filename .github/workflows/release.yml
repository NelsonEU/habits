name: Release

# Pushing a tag like v1.0.2 builds a signed Android APK and publishes it as a GitHub Release.
# The landing page links to releases/latest/download/habits.apk, which always points to the newest.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Built into the app; .env is git-ignored, so it's set here (same value as eas.json).
      EXPO_PUBLIC_FEEDBACK_EMAIL: hello@arn0.be
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test -- --ci
      - run: npx expo prebuild -p android --no-install
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The injected signing properties sign the build without touching the generated android/
        # folder. Only phone architectures: x86 is for emulators and would double the size.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd android
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../habits.apk
      # Installed apps refuse an update signed with another key, so the APK must carry exactly
      # EAS's certificate (its fingerprint is public: it ships in every APK).
      - name: Check the signature
        run: |
          set -o pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs habits.apk | tee certs.txt
          grep -q "SHA-256 digest: cc02c2dc1b3a79912473607bf5a352702806806b9686a28f9fe4d8a95018653f" certs.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size=$(stat -c %s habits.apk)
          sha=$(sha256sum habits.apk | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" habits.apk \
            --title "Habits ${GITHUB_REF_NAME#v}" \
            --notes "Android APK. Size: $size bytes ($((size / 1048576)) MB). SHA-256: \`$sha\`"
